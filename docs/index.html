<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED グラフィックイコライザー</title>
<style>
  :root{
    --panel-top:#3a3a3d;
    --panel-bottom:#242426;
    --screw:#8c8c8f;
    --led-off:#1a1f1a;
    --amber:#ffb020;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#0c0c0d;
    font-family:'Courier New', 'MS Gothic', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .rack{
    width:min(96vw,820px);
    background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom));
    border-radius:10px;
    padding:22px 22px 16px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -2px 4px rgba(0,0,0,0.5);
    position:relative;
    border:1px solid #111;
  }
  .screw{
    position:absolute;
    width:10px;height:10px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #cfcfd2, #6a6a6d 60%, #3a3a3c);
    box-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .screw::after{
    content:'';
    position:absolute;
    top:50%;left:50%;
    width:7px;height:1px;
    background:#3a3a3c;
    transform:translate(-50%,-50%) rotate(35deg);
  }
  .screw.tl{top:12px;left:12px;} .screw.tr{top:12px;right:12px;}
  .screw.bl{bottom:12px;left:12px;} .screw.br{bottom:12px;right:12px;}

  .header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 4px 14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    margin-bottom:14px;
  }
  .brand{
    color:#d8d6ce;
    font-size:13px;
    letter-spacing:3px;
    font-weight:bold;
  }
  .brand span{color:var(--amber);}
  .model{
    color:#8c8a82;
    font-size:10px;
    letter-spacing:2px;
  }

  .display{
    background:#050505;
    border-radius:4px;
    padding:16px 14px 8px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,0.9), inset 0 0 0 1px #000;
  }

  .bars{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:3px;
    height:220px;
  }
  .bar{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column-reverse;
    gap:2px;
  }
  .seg{
    width:100%;
    flex:1;
    border-radius:1px;
    background:var(--led-off);
    transition:background-color 60ms linear, box-shadow 60ms linear;
  }

  .freqlabels{
    display:flex;
    justify-content:space-between;
    padding:8px 2px 0;
  }
  .freqlabels span{
    color:#6b6a63;
    font-size:9px;
    letter-spacing:0.5px;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    padding:0 4px;
  }
  .status{
    color:#8c8a82;
    font-size:11px;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#3a3a3c;
    box-shadow:0 0 0 rgba(255,60,40,0);
  }
  .dot.live{
    background:#ff3c28;
    box-shadow:0 0 8px 2px rgba(255,60,40,0.7);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.5;}
  }

  button{
    font-family:inherit;
    letter-spacing:2px;
    font-size:12px;
    font-weight:bold;
    padding:10px 22px;
    border-radius:5px;
    border:1px solid #000;
    cursor:pointer;
    background:linear-gradient(180deg,#4a4a4d,#2c2c2e);
    color:#e6e4dc;
    box-shadow:0 2px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  button:active{
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.6);
    transform:translateY(1px);
  }
  button.on{
    background:linear-gradient(180deg,#b8460f,#7a2c08);
    color:#ffe6cc;
  }
  button:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  .msg{
    color:#c98a4a;
    font-size:11px;
    text-align:center;
    margin-top:10px;
    min-height:14px;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

<div class="rack">
  <div class="screw tl"></div><div class="screw tr"></div>
  <div class="screw bl"></div><div class="screw br"></div>

  <div class="header">
    <div class="brand">GRAPHIC<span>EQ</span></div>
    <div class="model">MIC INPUT ANALYZER</div>
  </div>

  <div class="display">
    <div class="bars" id="bars"></div>
    <div class="freqlabels" id="labels"></div>
  </div>

  <div class="controls">
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="statusText">STANDBY</span>
    </div>
    <button id="toggleBtn">MIC START</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
(function(){
  const NUM_BARS = 24;
  const SEGMENTS = 18;
  const barsContainer = document.getElementById('bars');
  const labelsContainer = document.getElementById('labels');
  const toggleBtn = document.getElementById('toggleBtn');
  const statusText = document.getElementById('statusText');
  const dot = document.getElementById('dot');
  const msg = document.getElementById('msg');

  // 音楽的に意味のある周波数帯（対数配置）
  const freqEdges = [];
  const minF = 60, maxF = 12000;
  for(let i=0;i<=NUM_BARS;i++){
    freqEdges.push(minF * Math.pow(maxF/minF, i/NUM_BARS));
  }
  const labelIdx = [0,4,8,12,16,20,23];

  // バーとセグメントのDOM生成
  const segEls = [];
  for(let b=0;b<NUM_BARS;b++){
    const barEl = document.createElement('div');
    barEl.className = 'bar';
    const segs = [];
    for(let s=0;s<SEGMENTS;s++){
      const segEl = document.createElement('div');
      segEl.className = 'seg';
      barEl.appendChild(segEl);
      segs.push(segEl);
    }
    barsContainer.appendChild(barEl);
    segEls.push(segs);

    if(labelIdx.includes(b)){
      const lab = document.createElement('span');
      const f = freqEdges[b];
      lab.textContent = f >= 1000 ? (f/1000).toFixed(1)+'k' : Math.round(f);
      labelsContainer.appendChild(lab);
    } else if(b % 4 !== 0){
      // spacing filler for alignment (invisible)
    }
  }
  // ensure label row has NUM_BARS-consistent spacing by adding blanks where not added
  // (simple approach: labels only at labelIdx, flex justify handles spacing)

  let audioCtx, analyser, source, stream, dataArray, rafId;
  let running = false;

  function segColor(segIndexFromBottom, totalOn){
    // segIndexFromBottom: 0 = 最下段
    const ratio = segIndexFromBottom / SEGMENTS;
    if(ratio > 0.85) return {bg:'#ff3b30', glow:'rgba(255,59,48,0.85)'};
    if(ratio > 0.65) return {bg:'#ffb020', glow:'rgba(255,176,32,0.8)'};
    return {bg:'#3ddc61', glow:'rgba(61,220,97,0.75)'};
  }

  function resetBars(){
    segEls.forEach(segs=>{
      segs.forEach(seg=>{
        seg.style.background = 'var(--led-off)';
        seg.style.boxShadow = 'none';
      });
    });
  }

  const peakHold = new Array(NUM_BARS).fill(0);
  const peakDecay = new Array(NUM_BARS).fill(0);

  function draw(){
    analyser.getByteFrequencyData(dataArray);
    const nyquist = audioCtx.sampleRate / 2;
    const binHz = nyquist / dataArray.length;

    for(let b=0;b<NUM_BARS;b++){
      const f0 = freqEdges[b], f1 = freqEdges[b+1];
      const i0 = Math.max(0, Math.floor(f0/binHz));
      const i1 = Math.min(dataArray.length-1, Math.ceil(f1/binHz));
      let sum=0, count=0;
      for(let i=i0;i<=i1;i++){ sum += dataArray[i]; count++; }
      const avg = count>0 ? sum/count : 0;
      let level = avg/255; // 0..1
      level = Math.pow(level, 0.7); // 視覚的に持ち上げる

      let onSegs = Math.round(level * SEGMENTS);

      if(onSegs > peakHold[b]){
        peakHold[b] = onSegs;
        peakDecay[b] = 0;
      } else {
        peakDecay[b]++;
        if(peakDecay[b] > 6){
          peakHold[b] = Math.max(onSegs, peakHold[b]-1);
          peakDecay[b] = 0;
        }
      }

      const segs = segEls[b];
      for(let s=0;s<SEGMENTS;s++){
        const seg = segs[s];
        const isOn = s < onSegs;
        const isPeak = s === peakHold[b]-1 && peakHold[b] > onSegs;
        if(isOn || isPeak){
          const c = segColor(s, SEGMENTS);
          seg.style.background = c.bg;
          seg.style.boxShadow = `0 0 6px 1px ${c.glow}`;
        } else {
          seg.style.background = 'var(--led-off)';
          seg.style.boxShadow = 'none';
        }
      }
    }
    rafId = requestAnimationFrame(draw);
  }

  async function start(){
    msg.textContent = '';
    toggleBtn.disabled = true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended'){ await audioCtx.resume(); }
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.75;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      running = true;
      toggleBtn.textContent = 'MIC STOP';
      toggleBtn.classList.add('on');
      statusText.textContent = 'LIVE';
      dot.classList.add('live');
      draw();
    }catch(err){
      console.error(err);
      if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
        msg.textContent = 'マイクへのアクセスが拒否されました。ブラウザの設定で許可してください。';
      } else if(err.name === 'NotFoundError'){
        msg.textContent = 'マイクが見つかりません。デバイスを確認してください。';
      } else {
        msg.textContent = 'マイクを起動できませんでした: ' + err.message;
      }
      statusText.textContent = 'ERROR';
    } finally {
      toggleBtn.disabled = false;
    }
  }

  function stop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    if(audioCtx){ audioCtx.close(); }
    resetBars();
    peakHold.fill(0);
    peakDecay.fill(0);
    toggleBtn.textContent = 'MIC START';
    toggleBtn.classList.remove('on');
    statusText.textContent = 'STANDBY';
    dot.classList.remove('live');
  }

  toggleBtn.addEventListener('click', ()=>{
    if(running){ stop(); } else { start(); }
  });

  resetBars();
})();
</script>

</body>
</html>
