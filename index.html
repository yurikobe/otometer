<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おとメーター</title>
<!-- M PLUS Rounded 1c (400, 500, 700) フォントの読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#fff6e9;
    --bg-bottom:#ffe3d0;
    --card:#ffffff;
    --ink:#5a4a3f;
    --sub:#736356;
    --accent:#ff8a5c;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family: "M PLUS Rounded 1c", sans-serif !important;
    font-weight: 400;
  }
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    overflow:hidden;
  }
  body{
    display:flex;
  }
  .phone{
    width:100%;
    height:100%;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:0;
    position:relative;
  }

  .title{
    text-align:center;
    margin:10px;
    flex-shrink:0;
  }
  .title h1{
    margin:0;
    font-size:24px;
    font-weight:700 !important;
    color:var(--ink);
    letter-spacing:1.6px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.7);
  }
  .title h1 .oto{
    color:var(--accent);
    font-weight:700 !important;
  }

  /* メイン画面：メーターカード */
  .card{
    flex:1;
    background:var(--card);
    padding:12px;
    display:flex;
    flex-direction:column;
    min-height:0; /* 重要：スクロールを防ぐ */
  }

  /* メーターの棒が並ぶエリア */
  .bars{
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:5px;
    min-height:0;
  }
  /* 1本のメーターの棒 */
  .bar{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column-reverse; /* 下から積み上げる */
    gap:4px;
  }
  /* 棒の中の1つのセグメント */
  .seg{
    width:100%;
    flex:1;
    border-radius:6px;
    background:#f1ece6; /* 初期状態の色（土台） */
  }

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin:10px;
    padding:0;
    flex-shrink:0;
  }
  .mic-btn{
    width:54px;
    height:54px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 50% 0%, #a8e8ae 0%, #3fae5c 85%);
    box-shadow:0 2px 6px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 200ms;
    position:relative;
  }
  .mic-btn.on{
    background:radial-gradient(circle at 50% 0%, #ffb3a8 0%, #d43f30 85%);
  }
  .mic-btn svg{
    width:36px;
    height:36px;
    display:block;
  }

  .ring{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:100%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2.5px solid #ff5c4c;
    opacity:0;
    pointer-events:none;
  }
  .mic-btn.on .ring{
    animation:pulse 1.5s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:0.8; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.37); }
  }

  .msg{
    color:#e0724a;
    font-size:14px;
    font-weight:400;
    text-align:center;
  }
  .msg:empty{
    display:none;
  }

  /* 歯車（設定）ボタンのCSS修正 */
  .settings-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
    padding:0; /* paddingをリセット */
  }
  .settings-btn svg{
    width:24px; /* サイズを固定 */
    height:24px;
    display:block;
    flex-shrink:0; /* 潰れるのを防ぐ */
  }

  /* --- 虹色演出用オーバーレイ --- */
  .rainbow-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(0deg,
      rgba(255, 71, 87, 0.45) 0%,
      rgba(255, 165, 2, 0.45) 15%,
      rgba(255, 234, 167, 0.45) 30%,
      rgba(46, 213, 115, 0.45) 50%,
      rgba(30, 144, 255, 0.45) 70%,
      rgba(155, 89, 182, 0.45) 85%,
      rgba(255, 71, 87, 0.45) 100%
    );
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease-out;
    display: none;
  }
  .rainbow-overlay.active {
    opacity: 1;
    display: block;
    transition: opacity 0.1s ease-in;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(60,45,35,0.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{
    display:flex;
  }
  .modal-card{
    background:#fffaf3;
    border-radius:24px;
    padding:24px 20px 20px;
    width:100%;
    max-width:320px;
    box-shadow:0 16px 40px rgba(0,0,0,0.25);
  }
  .modal-card h2{
    margin:0 0 16px;
    font-size:16px;
    font-weight:700 !important;
    color:var(--ink);
    text-align:center;
  }
  .control-group{
    margin-bottom:16px;
  }
  .range-box{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:2px;
  }
  .sens-range{
    flex:1;
    height:24px;
    accent-color:var(--accent);
  }
  .sens-num{
    font-size:18px;
    font-weight:700 !important;
    color:var(--accent);
    width:40px;
    text-align:center;
  }
  .sens-labels{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:400;
    color:var(--sub);
    padding:0 3px;
  }

  .check-box{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink);
    margin: 20px 0;
  }
  .check-box input[type="checkbox"]{
    width:18px;
    height:18px;
    accent-color:var(--accent);
  }

  .modal-close{
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:white;
    font-size:14px;
    font-weight:500 !important;
    letter-spacing:1px;
    cursor:pointer;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="rainbow-overlay" id="rainbowOverlay"></div>

<div class="phone">
  <!-- 歯車（設定）ボタンの修正 -->
  <button class="settings-btn" id="settingsBtn" aria-label="せってい">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83a2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33a1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2a2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0a2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2a2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83a2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0a2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2a2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="title">
    <h1><span class="oto">おと</span>メーター</h1>
  </div>

  <!-- メイン画面（メーター） -->
  <div class="card">
    <div class="bars" id="bars"></div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" aria-label="マイク">
      <div class="ring"></div>
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="white"/>
        <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11Z" fill="white"/>
      </svg>
    </button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2>せってい</h2>
      <div class="control-group">
        <div class="range-box">
          <input type="range" id="sensRange" class="sens-range" min="1" max="100" value="50">
          <span class="sens-num" id="sensNum">50</span>
        </div>
        <div class="sens-labels">
          <span>にぶい</span>
          <span>びんかん</span>
        </div>
      </div>
      <label class="check-box">
        <!-- 【修正】デフォルトOFF -->
        <input type="checkbox" id="rainbowToggle">
        <span>音が大きいとき虹色にする</span>
      </label>
      <button class="modal-close" id="modalClose">とじる</button>
    </div>
  </div>
</div>

<script>
(function(){
  // --- 初期設定 ---
  const NUM_BARS = 14;   // メーターの棒の数
  const SEGMENTS = 16;   // 棒の中のセグメントの数
  const OFF_COLOR = '#f1ece6'; // 土台（OFF）の色

  const barsContainer = document.getElementById('bars');
  const micBtn = document.getElementById('micBtn');
  const msg = document.getElementById('msg');
  const settingsBtn = document.getElementById('settingsBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const sensRange = document.getElementById('sensRange');
  const sensNum = document.getElementById('sensNum');
  const rainbowToggle = document.getElementById('rainbowToggle');
  const rainbowOverlay = document.getElementById('rainbowOverlay');

  // セグメントの色定義（下から上にグラデーション）
  const LEVELS = 5;
  const LEVEL_HUE = [142, 84, 48, 28, 4];   // 緑 -> 黄 -> 橙 -> 赤
  const LEVEL_SAT = [58, 62, 88, 88, 78];   // 彩度
  const LEVEL_LIGHT = [48, 54, 58, 58, 56]; // 輝度
  const BLACK_MIX_MAX = 0.4; // 左右端で黒を混ぜる量
  const WHITE_MIX_MAX = 0.4; // 右側端で白を混ぜる量

  // 1つのセグメントの色を計算
  function segColor(barIndex, segIndexFromBottom){
    const level = Math.min(LEVELS-1, Math.floor(segIndexFromBottom / SEGMENTS * LEVELS));
    const t = NUM_BARS > 1 ? barIndex / (NUM_BARS - 1) : 0.5;
    const dist = t - 0.5;
    const baseL = LEVEL_LIGHT[level];
    let l;
    if(dist <= 0){ // 左半分（黒を混ぜる）
      const factor = (-dist) / 0.5;
      l = baseL * (1 - factor * BLACK_MIX_MAX);
    } else { // 右半分（白を混ぜる）
      const factor = dist / 0.5;
      l = baseL + (100 - baseL) * factor * WHITE_MIX_MAX;
    }
    return `hsl(${LEVEL_HUE[level]}, ${LEVEL_SAT[level]}%, ${l}%)`;
  }

  // メーターの棒とセグメントを画面上に作成（初期化）
  const segEls = [];
  function createBars() {
    barsContainer.innerHTML = ''; // 既存をクリア
    for(let b=0;b<NUM_BARS;b++){
      const barEl = document.createElement('div');
      barEl.className = 'bar';
      const segs = [];
      for(let s=0;s<SEGMENTS;s++){
        const segEl = document.createElement('div');
        segEl.className = 'seg';
        barEl.appendChild(segEl);
        segs.push(segEl);
      }
      barsContainer.appendChild(barEl);
      segEls.push(segs);
    }
  }
  createBars(); // ここでメイン画面を作成

  // メーターを土台の色にリセット
  function resetBars(){
    segEls.forEach(segs=>{
      segs.forEach(seg=> seg.style.background = OFF_COLOR);
    });
    rainbowOverlay.classList.remove('active');
  }

  // --- オーディオ処理 ---
  let audioCtx, analyser, source, stream, dataArray, rafId;
  let running = false;
  let sensitivity = 50; // 初期感度
  let useRainbow = false; // 初期虹色OFF
  const smoothLevel = new Array(NUM_BARS).fill(0); // なめらかにするための保持

  // ノイズゲートとゲインの計算（感度から）
  function currentGate(){
    const t = (sensitivity - 1) / 99; // 0 (にぶい) to 1 (びんかん)
    return {
      margin: 60 + (-50 * t), // 60 -> 10 (dBmargin)
      gain: 0.6 + (1.4 * t)   // 0.6 -> 2.0 (ゲイン倍率)
    };
  }

  // マイク解析（メインループ）
  function draw(){
    analyser.getByteFrequencyData(dataArray);

    const freqLength = dataArray.length;
    const nyquist = audioCtx.sampleRate / 2;
    const binHz = nyquist / freqLength;

    // 解析範囲（80Hz〜8000Hz）
    const f0 = 80, f1 = 8000;
    const gate = currentGate();
    const release = 0.25; // なめらかに戻る（1.0で一瞬）

    for(let b=0;b<NUM_BARS;b++){
      const fr0 = f0 * Math.pow(f1/f0, b/NUM_BARS);
      const fr1 = f0 * Math.pow(f1/f0, (b+1)/NUM_BARS);
      const i0 = Math.floor(fr0 / binHz);
      const i1 = Math.min(freqLength - 1, Math.ceil(fr1 / binHz));

      let sum = 0, count = 0;
      for(let i=i0; i<=i1; i++){ sum += dataArray[i]; count++; }
      const averageL = count>0 ? sum/count : 0; // 0〜255
      const dBVal = 20 * Math.log10(Math.max(1e-5, averageL / 255)) + 120; // 約15〜120dB

      const thresholddB = 75; // OFFの色とONの色の境目
      const levelFactor = thresholddB - gate.margin; // ゲインがかかり始める前の土台 dB
      const leveldB = thresholddB + Math.max(0, dBVal - levelFactor) * gate.gain; // 閾値dB以上にゲイン
      
      let level = Math.max(0, (leveldB - thresholddB) / (120 - thresholddB)); // 0.0〜1.0以上に
      level = Math.min(1, level * 1.3); // ONになるレベルをゲイン。1.0でカンスト
      level = Math.pow(level, 1.15); // ちょっと反応を鈍く

      // なめらかに戻る処理（上昇は一瞬）
      if(level > smoothLevel[b]){ smoothLevel[b] = level; }
      else { smoothLevel[b] += (level - smoothLevel[b]) * release; }
      level = smoothLevel[b];

      // セグメントへの反映
      const onSegs = Math.round(level * SEGMENTS);
      const segs = segEls[b];
      for(let s=0;s<SEGMENTS;s++){
        if(s < onSegs){ segs[s].style.background = segColor(b, s); }
        else { segs[s].style.background = OFF_COLOR; }
      }
    }

    // 虹色演出（音が大きいとき）
    const totalLevel = smoothLevel.reduce((a,b)=> a+b, 0) / NUM_BARS;
    if(useRainbow && totalLevel > 0.8){ rainbowOverlay.classList.add('active'); }
    else { rainbowOverlay.classList.remove('active'); }

    rafId = requestAnimationFrame(draw);
  }

  // --- イベント処理 ---
  // マイクボタンクリック
  async function start(){
    msg.textContent = ''; micBtn.disabled = true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024; // 1つの棒に入る波形の数。512本の周波数
      analyser.smoothingTimeConstant = 0.65; // なめらかさ
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      running = true; micBtn.classList.add('on');
      draw();
    }catch(err){
      console.error(err);
      if(err.name === 'NotAllowedError'){ msg.textContent = 'マイクを許可してね'; }
      else { msg.textContent = 'マイクをおこせなかったよ'; }
    } finally { micBtn.disabled = false; }
  }

  function stop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(audioCtx) audioCtx.close();
    resetBars();
    smoothLevel.fill(0);
    micBtn.classList.remove('on');
  }

  micBtn.addEventListener('click', ()=>{
    if(running){ stop(); } else { start(); }
  });

  // 設定モーダル
  settingsBtn.addEventListener('click', ()=>{ modalOverlay.classList.add('open'); });
  modalClose.addEventListener('click', ()=>{ modalOverlay.classList.remove('open'); });
  modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });

  sensRange.addEventListener('input', (e)=>{
    sensitivity = e.target.value;
    sensNum.textContent = sensitivity;
  });

  rainbowToggle.addEventListener('change', (e)=>{
    useRainbow = e.target.checked;
    if(!useRainbow) rainbowOverlay.classList.remove('active');
  });

  resetBars(); // 初期色セット
})();
</script>

</body>
</html>
