<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイク感度設定</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* シームレスなグラデーション背景 */
    .bg-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200vh;
      /* 赤 -> 青 -> 緑 -> 赤（一巡して最初に戻る） */
      background: linear-gradient(
        180deg, 
        #ff4e50 0%, 
        #1fddff 33.3%, 
        #6be585 66.6%, 
        #ff4e50 100%
      );
      background-size: 100% 200vh;
      background-repeat: repeat-y;
      z-index: -1;
      /* 無限に下方向へシームレススクロール */
      animation: seamlessScroll 12s linear infinite;
    }

    @keyframes seamlessScroll {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-200vh);
      }
    }

    /* 設定パネルカード */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    .error-message {
      color: #e53e3e;
      font-weight: bold;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    /* 行単位のレイアウト (紙吹雪・マイク感度で共通) */
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-label {
      font-weight: bold;
      color: #333;
    }

    .value-display {
      font-weight: bold;
      color: #333;
      text-align: right;
    }

    /* スライダー */
    .slider-container {
      margin-bottom: 8px;
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      appearance: none;
      background: #ddd;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3182ce;
      cursor: pointer;
    }

    /* 左寄せの補足テキスト */
    .note-text {
      text-align: left;
      font-size: 0.8rem;
      color: #666;
      line-height: 1.4;
      margin-top: 4px;
    }

    /* トグルスイッチ */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: #3182ce;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }
  </style>
</head>
<body>

  <!-- シームレス背景 -->
  <div class="bg-gradient"></div>

  <!-- コンテンツカード -->
  <div class="card">
    <!-- エラーテキスト -->
    <div class="error-message">マイクを起動できません：</div>

    <!-- 紙吹雪 ON/OFF 行 -->
    <div class="setting-row">
      <span class="setting-label">紙吹雪</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- マイク感度 行 (右側に「50」を配置) -->
    <div class="setting-row">
      <span class="setting-label">マイク感度</span>
      <span class="value-display" id="sensitivity-val">50</span>
    </div>

    <!-- スライダー -->
    <div class="slider-container">
      <input type="range" min="0" max="100" value="50" class="slider" id="sensitivity-slider">
    </div>

    <!-- 左寄せの注釈 -->
    <p class="note-text">数字が大きいほど、小さな音に反応します。</p>
  </div>

  <script>
    // スライダーの値を右寄せの「50」部分にリアルタイム反映
    const slider = document.getElementById('sensitivity-slider');
    const display = document.getElementById('sensitivity-val');

    slider.addEventListener('input', (e) => {
      display.textContent = e.target.value;
    });
  </script>
</body>
</html>
