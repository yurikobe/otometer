<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おとメーター</title>
<style>
  :root{
    --bg-top:#fff6e9;
    --bg-bottom:#ffe3d0;
    --card:#ffffff;
    --ink:#5a4a3f;
    --sub:#a8998c;
    --accent:#ff8a5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    height:100%;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .phone{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:22px 18px 26px;
  }

  .title{
    text-align:center;
    margin:6px 0 16px;
  }
  .title h1{
    margin:0;
    font-size:30px;
    font-weight:900;
    color:var(--ink);
    letter-spacing:2px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.7);
  }
  .title h1 .oto{
    color:var(--accent);
  }

  .card{
    flex:1;
    background:var(--card);
    border-radius:32px;
    padding:22px 18px;
    box-shadow:0 12px 30px rgba(200,150,110,0.25);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .bars{
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:5px;
    min-height:0;
  }
  .bar{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column-reverse;
    gap:4px;
  }
  .seg{
    width:100%;
    flex:1;
    border-radius:6px;
    background:#f1ece6;
    transition:background-color 90ms ease-out, box-shadow 90ms ease-out, transform 90ms ease-out;
  }

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding-top:22px;
  }

  .mic-btn{
    width:68px;
    height:68px;
    border-radius:50%;
    border:none;
    background:linear-gradient(180deg,#8adfa0,#4fc97c);
    box-shadow:0 6px 0 #2fa25a, 0 8px 16px rgba(79,201,124,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform 90ms ease-out, box-shadow 90ms ease-out, background 200ms;
    position:relative;
  }
  .mic-btn:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #2fa25a, 0 3px 8px rgba(79,201,124,0.4);
  }
  .mic-btn.on{
    background:linear-gradient(180deg,#ff8a7a,#ff5c4c);
    box-shadow:0 6px 0 #d43f30, 0 8px 16px rgba(255,92,76,0.4);
  }
  .mic-btn.on:active{
    box-shadow:0 1px 0 #d43f30, 0 3px 8px rgba(255,92,76,0.4);
  }
  .mic-btn svg{
    width:30px;
    height:30px;
  }
  .ring{
    position:absolute;
    top:calc(50% + 5px);
    left:50%;
    width:calc(100% + 16px);
    height:calc(100% + 16px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:3px solid #ff5c4c;
    opacity:0;
  }
  .mic-btn.on .ring{
    animation:pulse 1.5s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:0.6; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.35); }
  }

  .msg{
    color:#e0724a;
    font-size:12px;
    text-align:center;
    min-height:16px;
    padding-top:4px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="title">
    <h1><span class="oto">おと</span>メーター</h1>
  </div>

  <div class="card">
    <div class="bars" id="bars"></div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" aria-label="マイクをはじめる">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="white"/>
        <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11Z" fill="white"/>
      </svg>
    </button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
(function(){
  const NUM_BARS = 14;
  const SEGMENTS = 16;
  const barsContainer = document.getElementById('bars');
  const micBtn = document.getElementById('micBtn');
  const msg = document.getElementById('msg');

  const minF = 80, maxF = 8000;
  const freqEdges = [];
  for(let i=0;i<=NUM_BARS;i++){
    freqEdges.push(minF * Math.pow(maxF/minF, i/NUM_BARS));
  }

  // 下から上へ5段階（緑→黄緑→黄→オレンジ→赤）、左のバーほど暗め・右のバーほど明るめ
  const LEVELS = 5;
  const LEVEL_HUE = [142, 84, 48, 28, 4];
  const LEVEL_SAT = [58, 62, 88, 88, 78];
  const LEVEL_LIGHT = [48, 54, 58, 58, 56];
  const BRIGHTNESS_RANGE = 22; // 左端から右端でどれだけ明るくなるか(%)

  function segColor(barIndex, segIndexFromBottom){
    const level = Math.min(LEVELS-1, Math.floor(segIndexFromBottom / SEGMENTS * LEVELS));
    const t = NUM_BARS > 1 ? barIndex / (NUM_BARS - 1) : 0;
    const l = Math.min(88, LEVEL_LIGHT[level] + t * BRIGHTNESS_RANGE);
    return `hsl(${LEVEL_HUE[level]}, ${LEVEL_SAT[level]}%, ${l}%)`;
  }

  const segEls = [];
  for(let b=0;b<NUM_BARS;b++){
    const barEl = document.createElement('div');
    barEl.className = 'bar';
    const segs = [];
    for(let s=0;s<SEGMENTS;s++){
      const segEl = document.createElement('div');
      segEl.className = 'seg';
      barEl.appendChild(segEl);
      segs.push(segEl);
    }
    barsContainer.appendChild(barEl);
    segEls.push(segs);
  }

  function resetBars(){
    segEls.forEach(segs=>{
      segs.forEach(seg=>{
        seg.style.background = '#f1ece6';
        seg.style.boxShadow = 'none';
      });
    });
  }

  let audioCtx, analyser, source, stream, dataArray, rafId;
  let running = false;

  // 環境音（暗騒音）を無視するための設定
  const GATE_MARGIN = 34;      // 暗騒音レベルにこの値を足したラインより下は無視
  const MIN_GATE = 24;         // 最低でもこのレベル以下は無視
  let noiseFloor = new Array(NUM_BARS).fill(0);
  let calibrating = false;
  let calibrateFrames = 0;
  const CALIBRATE_TOTAL_FRAMES = 40; // 起動直後、約0.6〜0.7秒で周囲の音を測定

  const peakHold = new Array(NUM_BARS).fill(0);
  const peakDecay = new Array(NUM_BARS).fill(0);
  const bandAvgBuf = new Array(NUM_BARS).fill(0);

  function bandAverage(b){
    const nyquist = audioCtx.sampleRate / 2;
    const binHz = nyquist / dataArray.length;
    const f0 = freqEdges[b], f1 = freqEdges[b+1];
    const i0 = Math.max(0, Math.floor(f0/binHz));
    const i1 = Math.min(dataArray.length-1, Math.ceil(f1/binHz));
    let sum=0, count=0;
    for(let i=i0;i<=i1;i++){ sum += dataArray[i]; count++; }
    return count>0 ? sum/count : 0;
  }

  function draw(){
    analyser.getByteFrequencyData(dataArray);

    if(calibrating){
      for(let b=0;b<NUM_BARS;b++){
        noiseFloor[b] += bandAverage(b);
      }
      calibrateFrames++;
      if(calibrateFrames >= CALIBRATE_TOTAL_FRAMES){
        for(let b=0;b<NUM_BARS;b++){
          noiseFloor[b] = noiseFloor[b] / CALIBRATE_TOTAL_FRAMES;
        }
        calibrating = false;
      }
      rafId = requestAnimationFrame(draw);
      return;
    }

    for(let b=0;b<NUM_BARS;b++){
      const raw = bandAverage(b);
      const gate = Math.max(noiseFloor[b] + GATE_MARGIN, MIN_GATE);
      let adjusted = raw - gate;
      if(adjusted < 0) adjusted = 0;
      const maxPossible = 255 - gate;
      let level = maxPossible > 0 ? adjusted / maxPossible : 0;
      level = Math.min(1, Math.pow(level, 1.15));

      let onSegs = Math.round(level * SEGMENTS);

      if(onSegs > peakHold[b]){
        peakHold[b] = onSegs;
        peakDecay[b] = 0;
      } else {
        peakDecay[b]++;
        if(peakDecay[b] > 6){
          peakHold[b] = Math.max(onSegs, peakHold[b]-1);
          peakDecay[b] = 0;
        }
      }

      const segs = segEls[b];
      for(let s=0;s<SEGMENTS;s++){
        const seg = segs[s];
        const isOn = s < onSegs;
        const isPeak = s === peakHold[b]-1 && peakHold[b] > onSegs;
        if(isOn){
          const color = segColor(b, s);
          seg.style.background = color;
          seg.style.boxShadow = `0 0 8px 1px ${color}`;
        } else if(isPeak){
          const color = segColor(b, s);
          seg.style.background = color;
          seg.style.boxShadow = `0 0 6px 1px ${color}`;
        } else {
          seg.style.background = '#f1ece6';
          seg.style.boxShadow = 'none';
        }
      }
    }
    rafId = requestAnimationFrame(draw);
  }

  async function start(){
    msg.textContent = '';
    micBtn.disabled = true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended'){ await audioCtx.resume(); }
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.7;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      running = true;
      calibrating = true;
      calibrateFrames = 0;
      noiseFloor.fill(0);
      micBtn.classList.add('on');
      micBtn.setAttribute('aria-label','マイクをとめる');
      draw();
    }catch(err){
      console.error(err);
      if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
        msg.textContent = 'マイクをつかう じょうけんをOKにしてね';
      } else if(err.name === 'NotFoundError'){
        msg.textContent = 'マイクがみつからないよ';
      } else {
        msg.textContent = 'マイクをおこせなかったよ: ' + err.message;
      }
    } finally {
      micBtn.disabled = false;
    }
  }

  function stop(){
    running = false;
    calibrating = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    if(audioCtx){ audioCtx.close(); }
    resetBars();
    peakHold.fill(0);
    peakDecay.fill(0);
    micBtn.classList.remove('on');
    micBtn.setAttribute('aria-label','マイクをはじめる');
  }

  micBtn.addEventListener('click', ()=>{
    if(running){ stop(); } else { start(); }
  });

  resetBars();
})();
</script>

</body>
</html>
