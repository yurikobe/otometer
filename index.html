<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全画面グラデーションエフェクト</title>
  <style>
    /* --------------------------------------------------
       グラデーション用オーバーレイ (画面全体)
    -------------------------------------------------- */
    .gradient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* 下の要素の操作を邪魔しない */
      z-index: 999; /* 紙吹雪(例: z-index: 1000)のすぐ下になるよう設定 */
      
      /* 下から上に動くグラデーション背景 */
      background: linear-gradient(0deg, 
        rgba(255, 105, 180, 0.8), 
        rgba(255, 215, 0, 0.8), 
        rgba(0, 191, 255, 0.8), 
        rgba(147, 112, 219, 0.8)
      );
      background-size: 100% 300%;
      background-position: bottom; /* 初期位置：下 */
      
      opacity: 0; /* 通常時は非表示 */
      transition: opacity 1.5s ease-out; /* フェードアウト用のトランジション */
    }

    /* アニメーション再生中クラス */
    .gradient-overlay.active {
      opacity: 0.6; /* 透明度60% */
      animation: moveBottomToTop 3s linear forwards;
    }

    /* フェードアウト準備クラス（1.5秒経過後に付与） */
    .gradient-overlay.fading-out {
      opacity: 0;
    }

    /* 下から上に動くキーフレーム */
    @keyframes moveBottomToTop {
      0% {
        background-position: 0% 100%; /* 下 */
      }
      100% {
        background-position: 0% 0%;   /* 上 */
      }
    }

    /* デモ用スタイル (本番組み込み時には不要) */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }
    .demo-btn {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1001;
    }
  </style>
</head>
<body>

  <!-- グラデーション用要素 -->
  <div id="gradientOverlay" class="gradient-overlay"></div>

  <!-- デモ用発火ボタン（テスト用） -->
  <button class="demo-btn" onclick="triggerEffect()">紙吹雪＋グラデーション発火（テスト）</button>

  <script>
    // タイマー管理用変数
    let fadeStartTimer = null;
    let fadeEndTimer = null;

    /**
     * グラデーション発火関数
     * 本番環境で「紙吹雪」を発火させる既存処理（イベントや関数）の中に
     * この triggerGradientEffect() を一緒に呼び出すように組み込んでください。
     */
    function triggerGradientEffect() {
      const overlay = document.getElementById('gradientOverlay');

      // 既存のタイマーをクリア（連続発火時にフェードアウトタイミングをリセット）
      if (fadeStartTimer) clearTimeout(fadeStartTimer);
      if (fadeEndTimer) clearTimeout(fadeEndTimer);

      // 一旦CSSトランジションを無効化して瞬時にopacity: 0.6に戻すためのリセット
      overlay.style.transition = 'none';
      overlay.classList.remove('active', 'fading-out');
      
      // リフローを強制してアニメーションを最初から再再生させる
      void overlay.offsetWidth;

      // アニメーション再生状態（不透明度0.6、下から上への移動）をセット
      overlay.style.transition = 'opacity 1.5s ease-out';
      overlay.classList.add('active');

      // 1.5秒後にフェードアウトを開始（不透明度 0.6 -> 0）
      fadeStartTimer = setTimeout(() => {
        overlay.classList.add('fading-out');
      }, 1500);

      // 3.0秒後に状態を完全にクリーンアップ
      fadeEndTimer = setTimeout(() => {
        overlay.classList.remove('active', 'fading-out');
      }, 3000);
    }

    // デモ用発火用ラッパー関数
    function triggerTrigger() {
      // 画面上の紙吹雪処理などをここに記述
      // ...
      
      // グラデーションを発火
      triggerGradientEffect();
    }
    
    // ボタンクリック時の発火（デモ用）
    function triggerEffect() {
      triggerTrigger();
    }
  </script>
</body>
</html>
