<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おとメーター</title>
<!-- M PLUS Rounded 1c (400, 700) フォントの読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#fff6e9;
    --bg-bottom:#ffe3d0;
    --card:#ffffff;
    --ink:#5a4a3f;
    --sub:#736356;
    --accent:#ff8a5c;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family: "M PLUS Rounded 1c", sans-serif !important;
    font-weight: 400;
  }
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    overflow:hidden;
  }
  body{
    display:flex;
  }
  .phone{
    width:100%;
    height:100%;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:0;
    position:relative;
  }

  .title{
    text-align:center;
    margin:10px;
    flex-shrink:0;
  }
  .title h1{
    margin:0;
    font-size:24px;
    font-weight:700 !important;
    color:var(--ink);
    letter-spacing:1.6px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.7);
  }
  .title h1 .oto{
    color:var(--accent);
    font-weight:700 !important; /* 修正：おとの部分も確実に太字（700）を適用 */
  }

  .card{
    flex:1;
    background:var(--card);
    padding:12px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .bars{
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:5px;
    min-height:0;
  }
  .bar{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column-reverse;
    gap:4px;
  }
  .seg{
    width:100%;
    flex:1;
    border-radius:6px;
    background:#f1ece6;
  }

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin:10px;
    padding:0;
    flex-shrink:0;
  }
  .mic-btn{
    width:54px;
    height:54px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 50% 0%, #a8e8ae 0%, #3fae5c 85%);
    box-shadow:0 2px 6px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 200ms;
    position:relative;
  }
  .mic-btn.on{
    background:radial-gradient(circle at 50% 0%, #ffb3a8 0%, #d43f30 85%);
  }
  .mic-btn svg{
    width:36px;
    height:36px;
  }

  .ring{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:100%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2.5px solid #ff5c4c;
    opacity:0;
    pointer-events:none;
  }
  .mic-btn.on .ring{
    animation:pulse 1.5s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:0.8; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.37); }
  }

  .msg{
    color:#e0724a;
    font-size:14px;
    font-weight:400;
    text-align:center;
  }
  .msg:empty{
    display:none;
  }

  .settings-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
  }
  .settings-btn svg{
    width:20px;
    height:20px;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(60,45,35,0.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{
    display:flex;
  }
  .modal-card{
    background:#fffaf3;
    border-radius:24px;
    padding:26px 22px 22px;
    width:100%;
    max-width:320px;
    box-shadow:0 16px 40px rgba(0,0,0,0.25);
  }
  .modal-card h2{
    margin:0 0 4px;
    font-size:18px;
    font-weight:700 !important;
    color:var(--ink);
  }
  .modal-card p.desc{
    margin:0 0 18px;
    font-size:14px;
    font-weight:400;
    color:var(--sub);
  }
  .sens-value-row{
    text-align:center;
    margin-bottom:8px;
  }
  .sens-num{
    width:90px;
    padding:2px 4px;
    text-align:center;
    font-size:34px;
    font-weight:700 !important;
    color:var(--accent);
    border:none;
    background:transparent;
    appearance:textfield;
  }
  .sens-num::-webkit-outer-spin-button,
  .sens-num::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .sens-range-full{
    display:block;
    width:100%;
    margin-bottom:8px;
    accent-color:var(--accent);
  }
  .sens-labels{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    font-weight:400;
    color:var(--sub);
    margin-bottom:20px;
  }
  .modal-close{
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:white;
    font-size:14px;
    font-weight:400;
    letter-spacing:1px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">
  <button class="settings-btn" id="settingsBtn" aria-label="せってい">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="#8a7a6a" stroke-width="1.8"/>
      <path d="M19.4 13.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l1.9-1.48a.5.5 0 0 0 .12-.64l-1.8-3.12a.5.5 0 0 0-.6-.22l-2.24.9c-.47-.36-.98-.66-1.53-.88l-.34-2.38a.5.5 0 0 0-.5-.43h-3.6a.5.5 0 0 0-.5.43l-.34 2.38c-.55.22-1.06.52-1.53.88l-2.24-.9a.5.5 0 0 0-.6.22l-1.8 3.12a.5.5 0 0 0 .12.64l1.9 1.48c-.04.33-.06.66-.06 1s.02.67.06 1l-1.9 1.48a.5.5 0 0 0-.12.64l1.8 3.12c.13.22.4.31.6.22l2.24-.9c.47.36.98.66 1.53.88l.34 2.38c.05.25.26.43.5.43h3.6c.24 0 .45-.18.5-.43l.34-2.38c.55-.22 1.06-.52 1.53-.88l2.24.9c.2.09.47 0 .6-.22l1.8-3.12a.5.5 0 0 0-.12-.64l-1.9-1.48Z" stroke="#8a7a6a" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="title">
    <h1><span class="oto">おと</span>メーター</h1>
  </div>

  <div class="card">
    <div class="bars" id="bars"></div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" aria-label="マイクをはじめる">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="white"/>
        <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11Z" fill="white"/>
      </svg>
    </button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2>マイク感度</h2>
      <p class="desc">数字が大きいほど、小さな音にも反応しやすくなります</p>
      <div class="sens-value-row">
        <input type="number" id="sensNum" class="sens-num" min="1" max="100" value="50">
      </div>
      <input type="range" id="sensRange" class="sens-range-full" min="1" max="100" value="50">
      <div class="sens-labels">
        <span>にぶい</span>
        <span>びんかん</span>
      </div>
      <button class="modal-close" id="modalClose">とじる</button>
    </div>
  </div>
</div>

<script>
(function(){
  const NUM_BARS = 14;
  const SEGMENTS = 16;
  const OFF_COLOR = '#f1ece6';

  const barsContainer = document.getElementById('bars');
  const micBtn = document.getElementById('micBtn');
  const msg = document.getElementById('msg');
  const settingsBtn = document.getElementById('settingsBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const sensRange = document.getElementById('sensRange');
  const sensNum = document.getElementById('sensNum');

  const minF = 80, maxF = 8000;
  const freqEdges = [];
  for(let i=0;i<=NUM_BARS;i++){
    freqEdges.push(minF * Math.pow(maxF/minF, i/NUM_BARS));
  }

  const LEVELS = 5;
  const LEVEL_HUE = [142, 84, 48, 28, 4];
  const LEVEL_SAT = [58, 62, 88, 88, 78];
  const LEVEL_LIGHT = [48, 54, 58, 58, 56];
  const BLACK_MIX_MAX = 0.4;
  const WHITE_MIX_MAX = 0.4;

  function segColor(barIndex, segIndexFromBottom){
    const level = Math.min(LEVELS-1, Math.floor(segIndexFromBottom / SEGMENTS * LEVELS));
    const t = NUM_BARS > 1 ? barIndex / (NUM_BARS - 1) : 0.5;
    const dist = t - 0.5;
    const baseL = LEVEL_LIGHT[level];
    let l;
    if(dist <= 0){
      const factor = (-dist) / 0.5;
      l = baseL * (1 - factor * BLACK_MIX_MAX);
    } else {
      const factor = dist / 0.5;
      l = baseL + (100 - baseL) * factor * WHITE_MIX_MAX;
    }
    return `hsl(${LEVEL_HUE[level]}, ${LEVEL_SAT[level]}%, ${l}%)`;
  }

  const segEls = [];
  for(let b=0;b<NUM_BARS;b++){
    const barEl = document.createElement('div');
    barEl.className = 'bar';
    const segs = [];
    for(let s=0;s<SEGMENTS;s++){
      const segEl = document.createElement('div');
      segEl.className = 'seg';
      barEl.appendChild(segEl);
      segs.push(segEl);
    }
    barsContainer.appendChild(barEl);
    segEls.push(segs);
  }

  function resetBars(){
    segEls.forEach(segs=>{
      segs.forEach(seg=>{
        seg.style.background = OFF_COLOR;
        seg.style.opacity = '1';
      });
    });
  }

  let audioCtx, analyser, source, stream, dataArray, rafId;
  let running = false;

  let sensitivity = 50;
  const GATE_MARGIN_AT_MIN = 70;
  const GATE_MARGIN_AT_MAX = 5;
  const MIN_GATE_AT_MIN = 45;
  const MIN_GATE_AT_MAX = 3;
  const GAIN_AT_MIN = 0.55;
  const GAIN_AT_MAX = 2.0;

  function currentGate(){
    const t = (sensitivity - 1) / 99;
    return {
      margin: GATE_MARGIN_AT_MIN + (GATE_MARGIN_AT_MAX - GATE_MARGIN_AT_MIN) * t,
      min: MIN_GATE_AT_MIN + (MIN_GATE_AT_MAX - MIN_GATE_AT_MIN) * t,
      gain: GAIN_AT_MIN + (GAIN_AT_MAX - GAIN_AT_MIN) * t
    };
  }
  const noiseFloor = new Array(NUM_BARS).fill(0);
  const smoothLevel = new Array(NUM_BARS).fill(0);
  const RELEASE = 0.25;
  let calibrating = false;
  let calibrateFrames = 0;
  const CALIBRATE_TOTAL_FRAMES = 40;

  const peakLevel = new Array(NUM_BARS).fill(0);
  const peakTime = new Array(NUM_BARS).fill(0);
  const HOLD_MS = 800;
  const FADE_MS = 800;
  const PEAK_UPDATE_MARGIN = 0.005;

  function bandAverage(b){
    const nyquist = audioCtx.sampleRate / 2;
    const binHz = nyquist / dataArray.length;
    const f0 = freqEdges[b], f1 = freqEdges[b+1];
    const i0 = Math.max(0, Math.floor(f0/binHz));
    const i1 = Math.min(dataArray.length-1, Math.ceil(f1/binHz));
    let sum=0, count=0;
    for(let i=i0;i<=i1;i++){ sum += dataArray[i]; count++; }
    return count>0 ? sum/count : 0;
  }

  function draw(){
    analyser.getByteFrequencyData(dataArray);

    if(calibrating){
      for(let b=0;b<NUM_BARS;b++){
        noiseFloor[b] += bandAverage(b);
      }
      calibrateFrames++;
      if(calibrateFrames >= CALIBRATE_TOTAL_FRAMES){
        for(let b=0;b<NUM_BARS;b++){
          noiseFloor[b] = noiseFloor[b] / CALIBRATE_TOTAL_FRAMES;
        }
        calibrating = false;
      }
      rafId = requestAnimationFrame(draw);
      return;
    }

    const now = performance.now();
    const gate = currentGate();

    for(let b=0;b<NUM_BARS;b++){
      const raw = bandAverage(b);
      const gateLevel = Math.max(noiseFloor[b] + gate.margin, gate.min);
      let adjusted = raw - gateLevel;
      if(adjusted < 0) adjusted = 0;
      const maxPossible = 255 - gateLevel;
      let level = maxPossible > 0 ? adjusted / maxPossible : 0;
      level = Math.min(1, level * gate.gain);
      level = Math.min(1, Math.pow(level, 1.15));

      if(level > smoothLevel[b]){
        smoothLevel[b] = level;
      } else {
        smoothLevel[b] += (level - smoothLevel[b]) * RELEASE;
      }
      level = smoothLevel[b];

      let onSegs = Math.round(level * SEGMENTS);

      const prevElapsed = now - peakTime[b];
      const prevFaded = prevElapsed > HOLD_MS + FADE_MS;

      if(prevFaded){
        peakLevel[b] = level;
        peakTime[b] = now;
      } else if(level > peakLevel[b] + PEAK_UPDATE_MARGIN){
        peakLevel[b] = level;
        peakTime[b] = now;
      }

      const elapsed = now - peakTime[b];
      let peakOpacityVal;
      if(elapsed <= HOLD_MS){
        peakOpacityVal = 1;
      } else if(elapsed <= HOLD_MS + FADE_MS){
        peakOpacityVal = 1 - (elapsed - HOLD_MS) / FADE_MS;
      } else {
        peakOpacityVal = 0;
      }
      const peakSeg = Math.floor(peakLevel[b] * SEGMENTS) - 1;

      const segs = segEls[b];
      for(let s=0;s<SEGMENTS;s++){
        const seg = segs[s];
        const isOn = s < onSegs;
        const isPeak = !isOn && s === peakSeg && peakSeg >= onSegs && peakOpacityVal > 0;
        if(isOn){
          seg.style.background = segColor(b, s);
          seg.style.opacity = '1';
        } else if(isPeak){
          const vivid = segColor(b, s);
          const pct = Math.round(peakOpacityVal*100);
          seg.style.background = pct <= 1
            ? OFF_COLOR
            : `color-mix(in oklab, ${vivid} ${pct}%, ${OFF_COLOR})`;
          seg.style.opacity = '1';
        } else {
          seg.style.background = OFF_COLOR;
          seg.style.opacity = '1';
        }
      }
    }
    rafId = requestAnimationFrame(draw);
  }

  async function start(){
    msg.textContent = '';
    micBtn.disabled = true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended'){ await audioCtx.resume(); }
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.7;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      running = true;
      calibrating = true;
      calibrateFrames = 0;
      noiseFloor.fill(0);
      smoothLevel.fill(0);
      micBtn.classList.add('on');
      micBtn.setAttribute('aria-label','マイクをとめる');
      draw();
    }catch(err){
      console.error(err);
      if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
        msg.textContent = 'マイクを許可（きょか）してね';
      } else if(err.name === 'NotFoundError'){
        msg.textContent = 'マイクがみつからないよ';
      } else {
        msg.textContent = 'マイクをおこせなかったよ: ' + err.message;
      }
    } finally {
      micBtn.disabled = false;
    }
  }

  function stop(){
    running = false;
    calibrating = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    if(audioCtx){ audioCtx.close(); }
    resetBars();
    peakLevel.fill(0);
    peakTime.fill(0);
    smoothLevel.fill(0);
    micBtn.classList.remove('on');
    micBtn.setAttribute('aria-label','マイクをはじめる');
  }

  micBtn.addEventListener('click', ()=>{
    if(running){ stop(); } else { start(); }
  });

  function openModal(){
    sensRange.value = String(sensitivity);
    sensNum.value = String(sensitivity);
    modalOverlay.classList.add('open');
  }
  function closeModal(){
    modalOverlay.classList.remove('open');
  }
  function setSensitivity(v){
    let n = parseInt(v, 10);
    if(isNaN(n)) n = sensitivity;
    n = Math.max(1, Math.min(100, n));
    sensitivity = n;
    sensRange.value = String(n);
    sensNum.value = String(n);
  }

  settingsBtn.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e)=>{
    if(e.target === modalOverlay) closeModal();
  });
  sensRange.addEventListener('input', ()=> setSensitivity(sensRange.value));
  sensNum.addEventListener('input', ()=> setSensitivity(sensNum.value));

  resetBars();
})();
</script>

</body>
</html>
