<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おとメーター</title>
<!-- M PLUS Rounded 1c (400, 500, 700) フォントの読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#fff6e9;
    --bg-bottom:#ffe3d0;
    --card:#ffffff;
    --ink:#5a4a3f;
    --sub:#736356;
    --accent:#ff8a5c;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family: "M PLUS Rounded 1c", sans-serif !important;
    font-weight: 400;
  }
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    overflow:hidden;
  }
  body{
    display:flex;
  }
  .phone{
    width:100%;
    height:100%;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:0;
    position:relative;
  }

  .title{
    text-align:center;
    margin:10px;
    flex-shrink:0;
  }
  .title h1{
    margin:0;
    font-size:24px;
    font-weight:700 !important;
    color:var(--ink);
    letter-spacing:1.6px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.7);
  }
  .title h1 .oto{
    color:var(--accent);
    font-weight:700 !important;
  }

  .card{
    flex:1;
    background:var(--card);
    padding:12px;
    border-radius: 0;
    display:flex;
    flex-direction:column;
    min-height:0;
    box-shadow: -2px 2px 10px rgba(90,74,63,0.05);
  }

  .bars{
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:5px;
    min-height:0;
  }
  .bar{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column-reverse;
    gap:4px;
  }
  .seg{
    width:100%;
    flex:1;
    border-radius:6px;
    background:#f1ece6;
  }

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin:10px;
    padding:0;
    flex-shrink:0;
  }
  .mic-btn{
    width:54px;
    height:54px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 50% 0%, #a8e8ae 0%, #3fae5c 85%);
    box-shadow:0 2px 6px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 200ms;
    position:relative;
  }
  .mic-btn.on{
    background:radial-gradient(circle at 50% 0%, #ffb3a8 0%, #d43f30 85%);
  }
  .mic-btn svg{
    width:36px;
    height:36px;
    display:block;
  }

  .ring{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:100%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2.5px solid #ff5c4c;
    opacity:0;
    pointer-events:none;
  }
  .mic-btn.on .ring{
    animation:pulse 1.5s ease-out infinite;
  }
  @keyframes pulse{
    0%{ opacity:0.8; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.37); }
  }

  .msg{
    color:#e0724a;
    font-size:14px;
    font-weight:400;
    text-align:center;
  }
  .msg:empty{
    display:none;
  }

  .settings-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:110; 
    padding:0;
  }
  .settings-btn svg{
    width:18px;
    height:18px;
    display:block;
    flex-shrink:0;
  }

  /* 紙吹雪演出：画面全体に配置し、内部のpieceだけアニメーションさせる */
  .celebration-overlay {
    position: fixed;
    inset: 0;
    z-index: 200; 
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-container {
    position: absolute;
    inset: 0;
    opacity: 1;
    transition: opacity 1s linear;
  }
  .confetti-container.fading
